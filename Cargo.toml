[package]
name = "arcana"
version = "1.0.0"
edition = "2021"
description = "Arcana: a fantasy-inspired general-purpose programming language"
readme = "README.md"

[lib]
name = "arcana"
path = "src/lib.rs"

[[bin]]
name = "arcana"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
